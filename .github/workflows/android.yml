
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Extract project
        run: |
          mkdir -p work
          unzip -q BroilerFeedApp_Android_Studio_Project.zip -d work

      - name: Build APK
        run: |
          gradle -p work/BroilerFeedApp assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BroilerFeedApp-APK
          path: work/BroilerFeedApp/app/build/outputs/apk/debug/app-debug.apk
          
